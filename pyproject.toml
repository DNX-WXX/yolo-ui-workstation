[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-ui-workstation"
version = "3.0.0"
description = "YOLO 多版本训练与部署可视化工作站（支持 YOLOv5/v8/YOLO11/YOLO26）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "JZBH" }]
requires-python = ">=3.10"
keywords = ["YOLO", "ultralytics", "PyQt5", "deep-learning", "object-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyQt5>=5.15.9",
    "PyQt5-sip>=12.11.0",
    "ultralytics>=8.2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.14.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "polars>=1.0.0",
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
    "py-cpuinfo>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "isort>=5.13.0",
    "black>=24.0.0",
    "pre-commit>=3.5.0",
]

[project.gui-scripts]
yolo-ui-workstation = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["config*", "core*", "ui*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py310"]
